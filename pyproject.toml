[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xc-thermal-viewer"
version = "0.1.0"
description = "Interactive viewer of cross-country paraglider and hang-glider flights and their thermals."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matteo Di Sante", email = "m.disante06@gmail.com" }]
keywords = ["soaring", "paragliding", "hang gliding", "IGC", "thermals", "viewer"]
dependencies = [
    "PyQt6>=6.6",
    "pyqtgraph>=0.14",
    "PyOpenGL>=3.1.7",
    "pyproj>=3.6",
    "numpy>=2.0",
    "pandas>=3.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "filelock>=3.12",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
xc-thermal-viewer = "xc_thermal_viewer.app:main"

[project.urls]
Repository = "https://github.com/matteodisante/xc-thermal-viewer"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xc_thermal_viewer"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "C4", "SIM", "PTH", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
